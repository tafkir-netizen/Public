
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAFKIR | تفكير</title>

<style>
*{
 margin:0;
 padding:0;
 box-sizing:border-box;
}

:root{
 --black:#07070c;
 --white:#fff;
 --purple:#a855f7;
 --muted:#aaa4b8;
}

body{
 min-height:100vh;
 background:var(--black);
 color:var(--white);
 font-family:Arial,Tahoma,sans-serif;
 overflow-x:hidden;
}

/* النجوم المتحركة */
#stars{
 position:fixed;
 inset:-200px;
 z-index:0;
 pointer-events:none;
 background-image:
 radial-gradient(2px 2px at 30px 40px,#fff 98%,transparent),
 radial-gradient(1px 1px at 100px 120px,#fff 98%,transparent),
 radial-gradient(2px 2px at 180px 70px,#fff 98%,transparent),
 radial-gradient(1px 1px at 250px 190px,#fff 98%,transparent),
 radial-gradient(2px 2px at 320px 250px,#fff 98%,transparent);
 background-size:350px 300px;
 animation:starsMove 8s linear infinite;
 opacity:.65;
}

@keyframes starsMove{
 from{transform:translateY(0)}
 to{transform:translateY(300px)}
}

/* الشريط العلوي */
header{
 height:75px;
 display:none;
 align-items:center;
 justify-content:space-between;
 padding:0 20px;
 position:relative;
 z-index:5;
 background:#090910e8;
 border-bottom:1px solid #ffffff16;
 backdrop-filter:blur(12px);
}

.logo{
 font-size:23px;
 font-weight:bold;
 letter-spacing:3px;
}

.menu-button{
 width:47px;
 height:45px;
 border:1px solid #ffffff30;
 border-radius:12px;
 background:#171722;
 color:white;
 font-size:27px;
 cursor:pointer;
}

/* القائمة الجانبية للهاتف */
.drawer{
 position:fixed;
 top:0;
 right:-280px;
 width:270px;
 height:100vh;
 z-index:20;
 background:#101019;
 border-left:1px solid #ffffff20;
 transition:right .3s ease;
 padding:20px;
}

.drawer.open{
 right:0;
}

.drawer button{
 color:white;
 background:none;
 border:0;
 font-size:25px;
 cursor:pointer;
}

.overlay{
 position:fixed;
 inset:0;
 background:#000a;
 z-index:15;
 display:none;
}

.overlay.show{
 display:block;
}

/* التصميم العام */
.layout{
 position:relative;
 z-index:1;
 min-height:calc(100vh - 70px);
 display:flex;
}

/* الجانب الأيمن للكمبيوتر */
.sidebar{
 width:285px;
 min-width:285px;
 min-height:100vh;
 padding:35px 25px;
 border-left:1px solid #ffffff17;
 background:#0b0b12b8;
 display:flex;
 flex-direction:column;
 align-items:center;
}

.brand-area{
 width:100%;
 text-align:center;
 position:relative;
 padding:25px 0 35px;
}

.brand-title{
 font-size:53px;
 font-weight:900;
 color:white;
 letter-spacing:1px;
 position:relative;
 display:inline-block;
}

.purple-line{
 width:160px;
 height:4px;
 border-radius:10px;
 background:var(--purple);
 margin:12px auto 0;
 box-shadow:0 0 15px #a855f788;
}

/* زينة الشطرنج والدفاتر */
.decor{
 position:relative;
 width:100%;
 height:170px;
 margin-top:20px;
}

.rook{
 position:absolute;
 top:0;
 right:48px;
 font-size:55px;
 color:white;
 text-shadow:0 0 15px #ffffff44;
 animation:float 3s ease-in-out infinite;
}

.knight{
 position:absolute;
 top:45px;
 right:-14px;
 font-size:75px;
 color:#eee;
 transform:rotate(-12deg);
 text-shadow:0 0 18px #a855f766;
 animation:float 3.5s ease-in-out infinite;
}

.notebook{
 position:absolute;
 left:30px;
 bottom:8px;
 width:75px;
 height:90px;
 border-radius:5px 10px 10px 5px;
 background:#252037;
 border:2px solid #a855f7;
 transform:rotate(-10deg);
 box-shadow:5px 6px 0 #171323;
}

.notebook:before{
 content:"";
 position:absolute;
 top:12px;
 left:9px;
 right:9px;
 height:2px;
 background:#c4a2ed;
 box-shadow:0 13px #c4a2ed,0 26px #c4a2ed,0 39px #c4a2ed;
}

.notebook.second{
 left:75px;
 bottom:0;
 background:#171c2a;
 transform:rotate(9deg);
 border-color:#7770a0;
 z-index:-1;
}

@keyframes float{
 0%,100%{transform:translateY(0)}
 50%{transform:translateY(-9px)}
}

/* قائمة الكمبيوتر */
.desktop-menu{
 width:100%;
 margin-top:15px;
}

.desktop-menu button{
 width:100%;
 padding:16px;
 border-radius:12px;
 border:1px solid #a855f744;
 background:#a855f714;
 color:white;
 font-size:16px;
 text-align:right;
 cursor:pointer;
 transition:.2s;
}

.desktop-menu button:hover{
 background:#a855f733;
}

/* المحتوى الرئيسي */
.content{
 flex:1;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 padding:50px 20px;
 text-align:center;
}

.welcome{
 color:#aaa4b8;
 font-size:14px;
 letter-spacing:4px;
 margin-bottom:15px;
}

.content h1{
 font-size:clamp(36px,6vw,58px);
 margin-bottom:12px;
 color:white;
}

.content-description{
 color:#c3bdce;
 font-size:16px;
 line-height:2;
}

/* العد التنازلي */
.countdown{
 width:min(100%,600px);
 margin:45px auto 0;
 padding:30px 16px;
 background:#11111cbb;
 border:1px solid #ffffff20;
 border-radius:20px;
 box-shadow:0 15px 55px #0008;
}

.countdown h2{
 font-size:20px;
 margin-bottom:25px;
 color:white;
}

.timer{
 display:flex;
 justify-content:center;
 gap:10px;
 flex-wrap:wrap;
 direction:ltr;
}

.time-box{
 min-width:85px;
 padding:15px 9px;
 border-radius:12px;
 background:#08080f;
 border:1px solid #a855f733;
}

.time-box strong{
 display:block;
 font-size:32px;
 color:white;
 font-variant-numeric:tabular-nums;
}

.time-box span{
 display:block;
 font-size:12px;
 color:#bcb4c9;
 margin-top:5px;
}

.countdown-caption{
 margin-top:23px;
 font-size:16px;
 color:white;
}

/* الحقوق */
footer{
 position:relative;
 z-index:1;
 text-align:center;
 padding:23px 12px;
 color:#aaa4b8;
 border-top:1px solid #ffffff17;
 font-size:13px;
}

/* الهاتف */
@media(max-width:700px){

 header{
  display:flex;
 }

 .layout{
  min-height:calc(100vh - 75px);
 }

 .sidebar{
  display:none;
 }

 .content{
  padding:45px 16px;
 }

 .content h1{
  font-size:40px;
 }

 .countdown{
  margin-top:35px;
  padding:25px 10px;
 }

 .time-box{
  min-width:70px;
 }

 .time-box strong{
  font-size:26px;
 }

 .welcome{
  font-size:12px;
 }

}
</style>
</head>

<body>

<div id="stars"></div>

<header>
 <div class="logo">TAFKIR</div>
 <button class="menu-button" onclick="toggleMenu()">☰</button>
</header>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<!-- قائمة الهاتف فارغة -->
<aside class="drawer" id="drawer">
 <button onclick="toggleMenu()">×</button>
</aside>

<div class="layout">

 <!-- الجانب الأيمن للكمبيوتر -->
 <aside class="sidebar">

  <div class="brand-area">
   <div class="brand-title">تفكير</div>
   <div class="purple-line"></div>

   <div class="decor">
    <div class="rook">♜</div>
    <div class="knight">♞</div>
    <div class="notebook"></div>
    <div class="notebook second"></div>
   </div>
  </div>

  <div class="desktop-menu">
   <button onclick="goHome()">⌂ &nbsp; الرئيسية</button>
  </div>

 </aside>

 <!-- الصفحة الرئيسية -->
 <main class="content" id="home">

  <div class="welcome">WELCOME TO TAFKIR</div>

  <h1>مرحبا بك في تفكير</h1>

  <p class="content-description">
   عالم جديد، أفكار جديدة، وبداية مختلفة.
  </p>

  <section class="countdown">

   <h2>الوقت المتبقي لتجهيز الموقع</h2>

   <div class="timer">

    <div class="time-box">
     <strong id="days">50</strong>
     <span>يوم</span>
    </div>

    <div class="time-box">
     <strong id="hours">00</strong>
     <span>ساعة</span>
    </div>

    <div class="time-box">
     <strong id="minutes">00</strong>
     <span>دقيقة</span>
    </div>

    <div class="time-box">
     <strong id="seconds">00</strong>
     <span>ثانية</span>
    </div>

   </div>

   <div class="countdown-caption">
    عد تنازلي لتجهيز الموقع
   </div>

  </section>

 </main>

</div>

<footer>
 جميع الحقوق محفوظة © 2026 — saadin ouahibi
</footer>

<script>

/* القائمة */
function toggleMenu(){
 document.getElementById("drawer").classList.toggle("open");
 document.getElementById("overlay").classList.toggle("show");
}

function goHome(){
 document.getElementById("drawer").classList.remove("open");
 document.getElementById("overlay").classList.remove("show");
}

/* العد التنازلي: 50 يوم من تاريخ بداية الموقع */
const startDate = new Date("2026-11-26T00:00:00");
const endDate = new Date(startDate.getTime() + 50 * 24 * 60 * 60 * 1000);

function updateCountdown(){

 let remaining = Math.max(0,endDate-Date.now());
 let totalSeconds = Math.floor(remaining/1000);

 document.getElementById("days").textContent =
  Math.floor(totalSeconds/86400);

 document.getElementById("hours").textContent =
  String(Math.floor(totalSeconds%86400/3600)).padStart(2,"0");

 document.getElementById("minutes").textContent =
  String(Math.floor(totalSeconds%3600/60)).padStart(2,"0");

 document.getElementById("seconds").textContent =
  String(totalSeconds%60).padStart(2,"0");
}

updateCountdown();
setInterval(updateCountdown,1000);

</script>

</body>
</html>
