
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAFKIR</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b10;color:white;font-family:Arial,sans-serif;min-height:100vh}
#stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 20px 30px,#fff 50%,transparent),radial-gradient(1px 1px at 90px 80px,#fff 50%,transparent);background-size:180px 150px;opacity:.65;animation:stars 4s infinite alternate}
@keyframes stars{to{opacity:.25}}
header{height:65px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;position:relative;border-bottom:1px solid #ffffff22;background:#080b10}
.logo{font-size:24px;font-weight:bold;letter-spacing:2px}
.menu{font-size:27px;background:#151c25;color:white;border:1px solid #ffffff33;border-radius:9px;padding:4px 12px;cursor:pointer}
.drawer{position:fixed;z-index:5;right:-270px;top:0;width:250px;height:100vh;background:#111820;padding:20px;transition:.3s}
.drawer.open{right:0}
.drawer button{display:block;width:100%;padding:16px;text-align:right;background:none;color:white;border:0;border-bottom:1px solid #ffffff22;font-size:16px;cursor:pointer}
.drawer .close{font-size:25px;text-align:left}
main{position:relative;max-width:850px;margin:auto;padding:30px 15px}
.home{text-align:center;padding:35px 5px}
.home h1{font-size:55px;margin:15px}
.home p{color:#aab4bf}
.count{max-width:570px;margin:30px auto;background:#111820;padding:22px;border:1px solid #ffffff22;border-radius:18px}
.timer{display:flex;justify-content:center;gap:9px;direction:ltr;flex-wrap:wrap}
.time{background:#080d13;border:1px solid #ffffff22;padding:12px 8px;border-radius:10px;min-width:70px}
.time strong{display:block;font-size:28px}
.time span{font-size:12px;color:#aab4bf}
.caption{margin-top:15px;color:#c5ced7}
#chessPage{display:none}
.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
button.action{background:#19232e;color:white;border:1px solid #ffffff33;padding:11px 15px;border-radius:9px;cursor:pointer}
button.action.primary{background:#eee;color:#111;font-weight:bold}
.status{margin:12px 0;color:#ddd;min-height:24px}
.boardwrap{width:min(94vw,550px);margin:auto;background:#17212a;padding:7px;border-radius:12px}
.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1}
.sq{display:flex;justify-content:center;align-items:center;position:relative;cursor:pointer;aspect-ratio:1}
.light{background:#eeeed2}.dark{background:#769656}
.sq.selected{box-shadow:inset 0 0 0 4px #f5d66b}
.sq.target:after{content:"";width:25%;height:25%;background:#263b1c99;border-radius:50%;position:absolute}
.piece{font-size:clamp(25px,7vw,52px);position:relative;z-index:1;transition:transform .2s ease}
.white{color:white;text-shadow:0 1px 2px #222}
.black{color:#151515;text-shadow:0 1px 1px #fff8}
footer{position:relative;text-align:center;border-top:1px solid #ffffff22;padding:22px;color:#929eaa;margin-top:30px;font-size:13px}
@media(min-width:700px){.menu{display:block}}
</style>
</head>
<body>
<div id="stars"></div>
<header>
<div class="logo">TAFKIR</div>
<button class="menu" onclick="toggleMenu()">☰</button>
</header>

<div class="drawer" id="drawer">
<button class="close" onclick="toggleMenu()">✕</button>
<button onclick="home()">الرئيسية</button>
<button onclick="openChess()">دخول الشطرنج</button>
</div>

<main>
<section class="home" id="home">
<h1>TAFKIR</h1>
<p>مرحبا بك في عالم التفكير والتحدي</p>
<div class="count">
<div>الوقت المتبقي لإطلاق الموقع</div>
<div class="timer">
<div class="time"><strong id="days">30</strong><span>يوم</span></div>
<div class="time"><strong id="hours">00</strong><span>ساعة</span></div>
<div class="time"><strong id="minutes">00</strong><span>دقيقة</span></div>
<div class="time"><strong id="seconds">00</strong><span>ثانية</span></div>
</div>
<div class="caption">عد تنازلي لتجهيز الأخير للموقع</div>
</div>
</section>

<section id="chessPage">
<h2>♟ الشطرنج</h2>
<div class="buttons">
<button class="action primary" onclick="setMode('robot')">اللعب مع الروبوت</button>
<button class="action" onclick="setMode('two')">اللعب ثنائي</button>
<button class="action" onclick="resetGame()">إعادة اللعب</button>
<button class="action" onclick="home()">رجوع</button>
</div>
<div class="status" id="status">اختار طريقة اللعب</div>
<div class="boardwrap"><div class="board" id="board"></div></div>
</section>
</main>

<footer>جميع الحقوق محفوظة © 2026 — saadin ouahibi</footer>

<script>
const endDate=new Date("2026-12-26T00:00:00");
function countdown(){
let s=Math.max(0,Math.floor((endDate-Date.now())/1000));
document.getElementById("days").textContent=Math.floor(s/86400);
document.getElementById("hours").textContent=String(Math.floor(s%86400/3600)).padStart(2,"0");
document.getElementById("minutes").textContent=String(Math.floor(s%3600/60)).padStart(2,"0");
document.getElementById("seconds").textContent=String(s%60).padStart(2,"0");
}
countdown();setInterval(countdown,1000);

function toggleMenu(){document.getElementById("drawer").classList.toggle("open")}
function home(){
document.getElementById("home").style.display="block";
document.getElementById("chessPage").style.display="none";
document.getElementById("drawer").classList.remove("open");
}
function openChess(){
document.getElementById("home").style.display="none";
document.getElementById("chessPage").style.display="block";
document.getElementById("drawer").classList.remove("open");
render();
}

const symbols={wk:"♔",wq:"♕",wr:"♖",wb:"♗",wn:"♘",wp:"♙",bk:"♚",bq:"♛",br:"♜",bb:"♝",bn:"♞",bp:"♟"};
let board=[],selected=null,turn="w",mode="two",busy=false;

function resetGame(){
let back=["r","n","b","q","k","b","n","r"];
board=Array.from({length:8},()=>Array(8).fill(null));
for(let c=0;c<8;c++){
board[0][c]="b"+back[c];board[1][c]="bp";
board[6][c]="wp";board[7][c]="w"+back[c];
}
selected=null;turn="w";busy=false;
document.getElementById("status").textContent="دور الأبيض";
render();
}
function setMode(m){mode=m;resetGame();document.getElementById("status").textContent=m==="robot"?"أنت الأبيض ضد الروبوت الأسود":"اللعب ثنائي: الأبيض ضد الأسود"}
function legal(fr,fc,tr,tc){
let p=board[fr][fc];if(!p||!board[tr]||fr===tr&&fc===tc)return false;
let q=board[tr][tc];if(q&&q[0]===p[0])return false;
let dr=tr-fr,dc=tc-fc,t=p[1],dir=p[0]==="w"?-1:1;
if(t==="p"){
if(dc===0&&!q&&dr===dir)return true;
if(dc===0&&!q&&fr===(p[0]==="w"?6:1)&&dr===2*dir&&!board[fr+dir][fc])return true;
return Math.abs(dc)===1&&dr===dir&&!!q;
}
if(t==="n")return Math.abs(dr)*Math.abs(dc)===2;
if(t==="k")return Math.max(Math.abs(dr),Math.abs(dc))===1;
let diagonal=Math.abs(dr)===Math.abs(dc)&&dr!==0;
let straight=(dr===0&&dc!==0)||(dc===0&&dr!==0);
if(t==="b"&&!diagonal||t==="r"&&!straight||t==="q"&&!diagonal&&!straight)return false;
let sr=Math.sign(dr),sc=Math.sign(dc),r=fr+sr,c=fc+sc;
while(r!==tr||c!==tc){if(board[r][c])return false;r+=sr;c+=sc}
return true;
}
function sound(){
try{
let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();
o.frequency.value=500;g.gain.value=.04;o.connect(g);g.connect(a.destination);
o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.1);o.stop(a.currentTime+.1);
}catch(e){}
}
function move(fr,fc,tr,tc){
let p=board[fr][fc];board[tr][tc]=p;board[fr][fc]=null;
if(p==="wp"&&tr===0)board[tr][tc]="wq";
if(p==="bp"&&tr===7)board[tr][tc]="bq";
selected=null;turn=turn==="w"?"b":"w";sound();render();
document.getElementById("status").textContent=turn==="w"?"دور الأبيض":"دور الأسود";
}
function render(){
let el=document.getElementById("board");el.innerHTML="";
for(let r=0;r<8;r++)for(let c=0;c<8;c++){
let sq=document.createElement("div");
sq.className="sq "+((r+c)%2?"dark":"light");
if(selected&&selected[0]===r&&selected[1]===c)sq.classList.add("selected");
if(selected&&legal(selected[0],selected[1],r,c))sq.classList.add("target");
let p=board[r][c];
if(p){let span=document.createElement("span");span.className="piece "+(p[0]==="w"?"white":"black");span.textContent=symbols[p];sq.appendChild(span)}
sq.onclick=()=>clickSquare(r,c);el.appendChild(sq);
}
}
function clickSquare(r,c){
if(busy)return;
let p=board[r][c];
if(!selected){if(p&&p[0]===turn){selected=[r,c];render()}return}
let [fr,fc]=selected;
if(legal(fr,fc,r,c)){
move(fr,fc,r,c);
if(mode==="robot"&&turn==="b")setTimeout(robotMove,350);
}else if(p&&p[0]===turn){selected=[r,c];render()}
else{selected=null;render()}
}
function robotMove(){
let moves=[];
for(let r=0;r<8;r++)for(let c=0;c<8;c++)
if(board[r][c]&&board[r][c][0]==="b")
for(let x=0;x<8;x++)for(let y=0;y<8;y++)
if(legal(r,c,x,y))moves.push([r,c,x,y]);
if(!moves.length){document.getElementById("status").textContent="ما بقاتش حركات متاحة";return}
move(...moves[Math.floor(Math.random()*moves.length)]);
}
resetGame();
</script>
</body>
</html>
