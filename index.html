<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAFKIR | تفكير</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            background-color: #000000;
            color: #e5e5e5;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .layout {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }

        /* القائمة الجانبية */
        .sidebar {
            width: 270px;
            flex-shrink: 0;
            background-color: #070707;
            border-left: 1px solid #ff2a2a;
            padding: 26px 18px;
        }

        /* صندوق السمية مع الروك يطل من وراها والدفاتر */
        .brand-wrap {
            position: relative;
            margin-bottom: 24px;
            padding-top: 14px;
        }

        .rook-peek {
            position: absolute;
            top: -4px;
            left: 14px;
            font-size: 2rem;
            color: #ff2a2a;
            line-height: 1;
            z-index: 1;
            transform: rotate(-8deg);
        }

        .notebooks-peek {
            position: absolute;
            top: 2px;
            right: 12px;
            font-size: 1.15rem;
            z-index: 1;
        }

        .brand-box {
            position: relative;
            z-index: 2;
            background-color: #0b0000;
            border: 2px solid #ff2a2a;
            border-radius: 8px;
            padding: 14px 12px;
            text-align: center;
        }

        .brand-box .title {
            color: #ff2a2a;
            font-size: 1.55rem;
            font-weight: 800;
            letter-spacing: 3px;
            display: block;
        }

        .brand-box .sub {
            color: #999999;
            font-size: 0.82rem;
            margin-top: 4px;
            display: block;
        }

        /* القائمة تحت السمية */
        .menu-box {
            border: 1px solid #262626;
            border-radius: 8px;
            padding: 14px;
            background-color: #0a0a0a;
        }

        .menu-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #ff2a2a;
            font-size: 0.92rem;
            font-weight: 700;
            padding-bottom: 10px;
            margin-bottom: 10px;
            border-bottom: 1px solid #222222;
        }

        .menu-items {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .menu-items li {
            padding: 10px 12px;
            margin-bottom: 8px;
            border: 1px dashed #2e2e2e;
            border-radius: 6px;
            color: #9a9a9a;
            font-size: 0.9rem;
        }

        .menu-items li:last-child {
            margin-bottom: 0;
        }

        /* المساحة الرئيسية */
        .main-area {
            flex: 1;
            padding: 36px 28px;
        }

        .canvas-box {
            max-width: 820px;
            border: 1px dashed #ff2a2a;
            border-radius: 10px;
            padding: 28px 22px;
            background-color: #070707;
            min-height: 300px;
        }

        .canvas-box h1 {
            color: #ff2a2a;
            margin-top: 0;
            font-size: 1.4rem;
        }

        .canvas-box p {
            color: #9a9a9a;
            line-height: 1.8;
            margin-bottom: 0;
        }

        /* ضبط العرض على الهاتف */
        @media (max-width: 768px) {
            .layout {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                border-left: none;
                border-bottom: 1px solid #ff2a2a;
                padding: 20px 16px;
            }
            .main-area {
                width: 100%;
                padding: 20px 16px;
            }
            .canvas-box {
                min-height: 220px;
            }
        }
    </style>
</head>
<body>

    <div class="layout">
        <aside class="sidebar">
            <div class="brand-wrap">
                <span class="rook-peek" aria-hidden="true">♜</span>
                <span class="notebooks-peek" aria-hidden="true">📓📒</span>
                <div class="brand-box">
                    <span class="title">TAFKIR</span>
                    <span class="sub">♜ الدفاتر والتفكير 📓</span>
                </div>
            </div>

            <nav class="menu-box" aria-label="قائمة الموقع">
                <div class="menu-header">
                    <span>القائمة</span>
                    <span>♟️</span>
                </div>
                <ul class="menu-items">
                    <li>عنصر 1 — قيد التفكير</li>
                    <li>عنصر 2 — قيد التفكير</li>
                    <li>عنصر 3 — قيد التفكير</li>
                    <li>عنصر 4 — قيد التفكير</li>
                </ul>
            </nav>
        </aside>

        <main class="main-area">
            <section class="canvas-box">
                <h1>مساحة مفتوحة 📓</h1>
                <p>
                    هنا غادي تبدا تحط اللي بغيتي من بعد ما تحدد شنو غيكون في القائمة وفي الصفحة.
                </p>
            </section>
        </main>
    </div>

    <script>
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && ['c', 'u', 's', 'p'].includes(e.key.toLowerCase())) {
                e.preventDefault();
            }
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'i')) {
                e.preventDefault();
            }
        });
    </script>

</body>
</html>
