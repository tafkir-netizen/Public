<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>TAFKIR | Chess</title>
<style>
:root{--bg:#080808;--panel:#111;--line:#303030;--white:#f4f4f4;--muted:#aaa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--white);font-family:Arial,Tahoma,sans-serif;min-height:100vh;overflow-x:hidden}
#stars{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.star{position:absolute;background:#fff;border-radius:50%;opacity:.55;animation:twinkle 3s infinite alternate}
@keyframes twinkle{from{opacity:.15}to{opacity:.8}}
header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 6%;border-bottom:1px solid #252525;background:#080808d9;position:relative;z-index:5}
.logo{font-weight:900;letter-spacing:3px;font-size:23px}
nav{display:flex;gap:25px}
nav a{color:#ddd;text-decoration:none;font-size:14px}
.menu-btn{display:none;background:none;color:white;border:1px solid #555;border-radius:9px;padding:7px 11px;font-size:23px}
.drawer{display:none;position:absolute;top:72px;right:0;width:220px;padding:18px;background:#111;border:1px solid #333;border-radius:0 0 0 14px;z-index:8}
.drawer.open{display:grid;gap:18px}
.drawer a{color:white;text-decoration:none}
main{width:min(1000px,94%);margin:38px auto 60px}
.hero{text-align:center;margin-bottom:28px}
h1{font-size:clamp(26px,5vw,42px);margin:0 0 9px}
.sub{color:#aaa;margin:0}
.panel{background:#101010;border:1px solid #303030;border-radius:18px;padding:clamp(14px,3vw,25px);box-shadow:0 12px 40px #0008}
.mode-row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
button{font:inherit;cursor:pointer}
.mode{background:#eee;color:#090909;border:1px solid #eee;padding:12px 20px;border-radius:10px;font-weight:700}
.mode.secondary{background:#111;color:#eee}
.mode.active{outline:2px solid #aaa;outline-offset:3px}
.status{min-height:28px;text-align:center;color:#ddd;margin:10px 0 16px;font-size:15px}
.game-layout{display:flex;justify-content:center;align-items:center;gap:24px;flex-wrap:wrap}
.board-wrap{width:min( min(76vw,540px), calc(100vw - 42px));}
.board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border:3px solid #eee;border-radius:5px;overflow:hidden;box-shadow:0 10px 35px #0009;direction:ltr;touch-action:manipulation}
.sq{border:0;padding:0;display:flex;align-items:center;justify-content:center;position:relative;min-width:0;min-height:0}
.sq.light{background:#eee;color:#111}
.sq.dark{background:#252525;color:#fff}
.sq.selected{box-shadow:inset 0 0 0 4px #777}
.sq.hint:after{content:"";width:23%;height:23%;border-radius:50%;background:#777b;position:absolute}
.sq.capture:after{content:"";position:absolute;inset:4px;border:3px solid #888;border-radius:50%}
.piece{font-family:"DejaVu Sans",serif;font-size:clamp(23px,6.2vw,53px);line-height:1;z-index:2;user-select:none;pointer-events:none;filter:drop-shadow(0 1px 1px #777)}
.sq.light .piece{color:#111;text-shadow:0 0 1px #000}
.sq.dark .piece{color:#fff;text-shadow:0 0 2px #000}
.piece.moving{transition:transform .24s cubic-bezier(.2,.75,.25,1)}
.side{width:190px;display:grid;gap:10px}
.info{border:1px solid #333;border-radius:12px;padding:13px;background:#151515}
.info b{display:block;margin-bottom:5px}
.info small{color:#aaa;line-height:1.6}
.action{background:#171717;color:white;border:1px solid #555;border-radius:9px;padding:10px}
.action:hover,.mode.secondary:hover{background:#242424}
footer{border-top:1px solid #252525;text-align:center;padding:23px 12px;color:#888;font-size:13px}
.count{font-variant-numeric:tabular-nums;letter-spacing:2px;font-size:clamp(23px,5vw,36px);font-weight:bold;margin:10px 0}
.launch{text-align:center;margin:48px auto 0;padding:24px 10px;border-top:1px solid #242424}
.launch p{color:#aaa;margin:7px 0}
@media(max-width:650px){header{height:62px;padding:0 5%}nav{display:none}.menu-btn{display:block}.drawer{top:62px}main{margin-top:25px}.side{width:min(100%,420px);grid-template-columns:1fr 1fr}.info{grid-column:1/-1}.board-wrap{width:min(92vw,480px)}}
</style>
</head>
<body>
<div id="stars"></div>
<header>
  <div class="logo">TAFKIR</div>
  <nav><a href="#home">الرئيسية</a><a href="#chess">الشطرنج</a></nav>
  <button class="menu-btn" id="menuBtn" aria-label="القائمة">☰</button>
  <div class="drawer" id="drawer"><a href="#home" id="homeLink">الرئيسية</a><a href="#chess" id="chessLink">دخول الشطرنج</a></div>
</header>
<main id="home">
  <section class="hero">
    <h1>TAFKIR</h1>
    <p class="sub">فكّر، خطّط، واربح.</p>
  </section>
  <section class="panel" id="chess">
    <div class="mode-row">
      <button class="mode active" id="robotBtn">اللعب مع الروبوت</button>
      <button class="mode secondary" id="twoBtn">اللعب ثنائي</button>
    </div>
    <div class="status" id="status">اختار طريقة اللعب وابدأ المباراة.</div>
    <div class="game-layout">
      <div class="board-wrap"><div class="board" id="board" aria-label="رقعة الشطرنج"></div></div>
      <aside class="side">
        <div class="info"><b id="modeTitle">اللعب مع الروبوت</b><small id="modeDesc">أنت تلعب بالأبيض، والروبوت يلعب بالأسود.</small></div>
        <button class="action" id="restart">إعادة المباراة ↻</button>
        <button class="action" id="soundBtn">الصوت: شغال ♪</button>
      </aside>
    </div>
  </section>
  <section class="launch">
    <h2>قريباً...</h2>
    <div class="count" id="countdown">30 : 00 : 00 : 00</div>
    <p>عد تنازلي لتجهيز الأخير للموقع</p>
  </section>
</main>
<footer>© 2026 TAFKIR — جميع الحقوق محفوظة</footer>
<script>
(function(){
 const stars=document.getElementById('stars');
 for(let i=0;i<65;i++){let s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.width=s.style.height=(Math.random()*2+1)+'px';s.style.animationDelay=Math.random()*3+'s';stars.appendChild(s)}
 const menuBtn=document.getElementById('menuBtn'),drawer=document.getElementById('drawer');
 menuBtn.onclick=()=>drawer.classList.toggle('open');
 drawer.querySelectorAll('a').forEach(a=>a.onclick=()=>drawer.classList.remove('open'));
 const glyph={wk:'♔',wq:'♕',wr:'♖',wb:'♗',wn:'♘',wp:'♙',bk:'♚',bq:'♛',br:'♜',bb:'♝',bn:'♞',bp:'♟'};
 const initial=()=>[
 ['br','bn','bb','bq','bk','bb','bn','br'],
 Array(8).fill('bp'),Array(8).fill(null),Array(8).fill(null),
 Array(8).fill(null),Array(8).fill(null),Array(8).fill('wp'),
 ['wr','wn','wb','wq','wk','wb','wn','wr']
 ];
 let board=initial(),turn='w',selected=null,targets=[],mode='robot',sound=true,busy=false,gameOver=false;
 const el=id=>document.getElementById(id), boardEl=el('board');
 function tone(){if(!sound)return;try{let C=window.AudioContext||window.webkitAudioContext,ctx=new C(),o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(520,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(360,ctx.currentTime+.08);g.gain.setValueAtTime(.08,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.12);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.13);o.onended=()=>ctx.close()}catch(e){}}
 function inside(r,c){return r>=0&&r<8&&c>=0&&c<8}
 function side(p){return p?p[0]:null}
 function pathClear(fr,fc,tr,tc){let dr=Math.sign(tr-fr),dc=Math.sign(tc-fc),r=fr+dr,c=fc+dc;while(r!==tr||c!==tc){if(board[r][c])return false;r+=dr;c+=dc}return true}
 function valid(fr,fc,tr,tc){
   if(!inside(tr,tc)|| (fr===tr&&fc===tc))return false;
   let p=board[fr][fc],dest=board[tr][tc];if(!p||side(dest)===side(p))return false;
   let kind=p[1],dr=tr-fr,dc=tc-fc,ar=Math.abs(dr),ac=Math.abs(dc),forward=p[0]==='w'?-1:1;
   if(kind==='p'){
     if(dc===0&&!dest&&dr===forward)return true;
     if(dc===0&&!dest&&((p[0]==='w'&&fr===6)||(p[0]==='b'&&fr===1))&&dr===2*forward&&!board[fr+forward][fc])return true;
     if(ac===1&&dr===forward&&dest)return true;
     return false;
   }
   if(kind==='n')return (ar===2&&ac===1)||(ar===1&&ac===2);
   if(kind==='k')return ar<=1&&ac<=1;
   if(kind==='r')return (dr===0||dc===0)&&pathClear(fr,fc,tr,tc);
   if(kind==='b')return ar===ac&&pathClear(fr,fc,tr,tc);
   if(kind==='q')return (dr===0||dc===0||ar===ac)&&pathClear(fr,fc,tr,tc);
   return false;
 }
 function allMoves(color){let out=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(side(board[r][c])===color)for(let tr=0;tr<8;tr++)for(let tc=0;tc<8;tc++)if(valid(r,c,tr,tc))out.push([r,c,tr,tc]);return out}
 function status(msg){el('status').textContent=msg}
 function render(){
  boardEl.innerHTML='';
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
   let sq=document.createElement('button');sq.className='sq '+((r+c)%2?'dark':'light');
   if(selected&&selected[0]===r&&selected[1]===c)sq.classList.add('selected');
   if(targets.some(m=>m[0]===r&&m[1]===c))sq.classList.add(board[r][c]?'capture':'hint');
   sq.dataset.r=r;sq.dataset.c=c;
   if(board[r][c]){let p=document.createElement('span');p.className='piece';p.textContent=glyph[board[r][c]];sq.appendChild(p)}
   sq.onclick=()=>clickSquare(r,c);boardEl.appendChild(sq);
  }
 }
 function clickSquare(r,c){
  if(busy||gameOver||(mode==='robot'&&turn==='b'))return;
  let p=board[r][c];
  if(selected){
   let [fr,fc]=selected;
   if(targets.some(m=>m[0]===r&&m[1]===c)){move(fr,fc,r,c);return}
   if(p&&side(p)===turn){select(r,c);return}
   selected=null;targets=[];render();return;
  }
  if(p&&side(p)===turn)select(r,c);
 }
 function select(r,c){selected=[r,c];targets=[];for(let tr=0;tr<8;tr++)for(let tc=0;tc<8;tc++)if(valid(r,c,tr,tc))targets.push([tr,tc]);render()}
 function move(fr,fc,tr,tc){
  let moving=board[fr][fc];if(!moving)return;
  busy=true;selected=null;targets=[];
  let destSq=boardEl.children[tr*8+tc],piece=document.createElement('span');
  piece.className='piece moving';piece.textContent=glyph[moving];
  let dx=fc-tc,dy=fr-tr;piece.style.transform=`translate(${dx*100}%,${dy*100}%)`;
  destSq.innerHTML='';destSq.appendChild(piece);
  requestAnimationFrame(()=>requestAnimationFrame(()=>piece.style.transform='translate(0,0)'));
  window.setTimeout(()=>{
    board[tr][tc]=moving;board[fr][fc]=null;
    if(moving[1]==='p'&&(tr===0||tr===7))board[tr][tc]=moving[0]+'q';
    turn=turn==='w'?'b':'w';busy=false;tone();render();
    const moves=allMoves(turn);
    if(!moves.length){gameOver=true;status('ما بقات حتى حركة متاحة — نهاية المباراة!');return}
    status(turn==='w'?'دور الأبيض':'دور الأسود');
    if(mode==='robot'&&turn==='b')window.setTimeout(robotMove,380);
  },250);
 }
 function robotMove(){
  if(mode!=='robot'||turn!=='b'||gameOver)return;
  let moves=allMoves('b');if(!moves.length){gameOver=true;status('نهاية المباراة!');return}
  let captures=moves.filter(m=>board[m[2]][m[3]]);let pool=captures.length?captures:moves;
  let m=pool[Math.floor(Math.random()*pool.length)];move(m[0],m[1],m[2],m[3]);
 }
 function reset(){board=initial();turn='w';selected=null;targets=[];busy=false;gameOver=false;render();status(mode==='robot'?'أنت تلعب بالأبيض. دورك!':'اللعب ثنائي: الأبيض يبدأ.')}
 function setMode(next){
  mode=next;el('robotBtn').classList.toggle('active',next==='robot');el('robotBtn').classList.toggle('secondary',next!=='robot');el('twoBtn').classList.toggle('active',next==='two');el('twoBtn').classList.toggle('secondary',next!=='two');
  el('modeTitle').textContent=next==='robot'?'اللعب مع الروبوت':'اللعب ثنائي';
  el('modeDesc').textContent=next==='robot'?'أنت تلعب بالأبيض، والروبوت يلعب بالأسود.':'لاعبان على نفس الجهاز: الأبيض ثم الأسود.';
  reset();
 }
 el('robotBtn').onclick=()=>setMode('robot');el('twoBtn').onclick=()=>setMode('two');
 el('restart').onclick=reset;
 el('soundBtn').onclick=()=>{sound=!sound;el('soundBtn').textContent='الصوت: '+(sound?'شغال ♪':'مطفأ')};
 const end=new Date('2026-12-26T00:00:00').getTime();
 function tick(){let d=Math.max(0,end-Date.now()),days=Math.floor(d/86400000),h=Math.floor(d%86400000/3600000),m=Math.floor(d%3600000/60000),s=Math.floor(d%60000/1000);el('countdown').textContent=[days,h,m,s].map(n=>String(n).padStart(2,'0')).join(' : ')}
 tick();setInterval(tick,1000);
 render();status('أنت تلعب بالأبيض. دورك!');
})();
</script>
</body>
</html>
