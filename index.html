<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAFKIR | تفكير</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            background-color: #000000;
            color: #e5e5e5;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* خلفية النجوم المتحركة */
        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .layout {
            position: relative;
            z-index: 1;
            display: flex;
            min-height: 100vh;
            width: 100%;
        }

        /* القائمة الجانبية */
        .sidebar {
            width: 270px;
            flex-shrink: 0;
            background-color: rgba(7, 7, 7, 0.82);
            backdrop-filter: blur(4px);
            border-left: 1px solid #ff2a2a;
            padding: 26px 18px;
        }

        /* صندوق السمية مع الروك والدفاتر */
        .brand-wrap {
            position: relative;
            margin-bottom: 24px;
            padding-top: 14px;
        }

        .rook-peek {
            position: absolute;
            top: -4px;
            left: 14px;
            font-size: 2rem;
            color: #ff2a2a;
            line-height: 1;
            z-index: 1;
            transform: rotate(-8deg);
        }

        .notebooks-peek {
            position: absolute;
            top: 2px;
            right: 12px;
            font-size: 1.15rem;
            z-index: 1;
        }

        .brand-box {
            position: relative;
            z-index: 2;
            background-color: rgba(11, 0, 0, 0.9);
            border: 2px solid #ff2a2a;
            border-radius: 8px;
            padding: 14px 12px;
            text-align: center;
        }

        .brand-box .title {
            color: #ff2a2a;
            font-size: 1.55rem;
            font-weight: 800;
            letter-spacing: 3px;
            display: block;
        }

        .brand-box .sub {
            color: #999999;
            font-size: 0.82rem;
            margin-top: 4px;
            display: block;
        }

        /* القائمة تحت السمية */
        .menu-box {
            border: 1px solid #262626;
            border-radius: 8px;
            padding: 14px;
            background-color: rgba(10, 10, 10, 0.85);
        }

        .menu-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #ff2a2a;
            font-size: 0.92rem;
            font-weight: 700;
            padding-bottom: 10px;
            margin-bottom: 10px;
            border-bottom: 1px solid #222222;
        }

        .menu-items {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .menu-items li {
            padding: 10px 12px;
            margin-bottom: 8px;
            border: 1px dashed #2e2e2e;
            border-radius: 6px;
            color: #9a9a9a;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .menu-items li:last-child {
            margin-bottom: 0;
        }

        .menu-items li.active-item {
            border: 1px solid #ff2a2a;
            background-color: rgba(20, 0, 0, 0.88);
            color: #ff2a2a;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu-items li:hover {
            border-color: #ff2a2a;
        }

        /* المساحة الرئيسية */
        .main-area {
            flex: 1;
            padding: 36px 28px;
        }

        .canvas-box {
            max-width: 820px;
            border: 1px solid #ff2a2a;
            border-radius: 10px;
            padding: 24px 20px;
            background-color: rgba(7, 7, 7, 0.82);
            backdrop-filter: blur(4px);
        }

        .game-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 1px solid #222222;
            padding-bottom: 14px;
            margin-bottom: 20px;
        }

        .game-header h1 {
            color: #ff2a2a;
            margin: 0;
            font-size: 1.4rem;
            letter-spacing: 1px;
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .turn-badge {
            background-color: #140000;
            border: 1px solid #ff2a2a;
            color: #ff2a2a;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.88rem;
            font-weight: 600;
        }

        .reset-btn {
            background-color: #ff2a2a;
            color: #000000;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .reset-btn:hover {
            opacity: 0.9;
        }

        /* رقعة الشطرنج */
        .board-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 0;
        }

        .chess-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            width: 100%;
            max-width: 440px;
            aspect-ratio: 1 / 1;
            border: 2px solid #ff2a2a;
            border-radius: 6px;
            overflow: hidden;
            direction: ltr;
        }

        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.5rem, 6vw, 2.3rem);
            cursor: pointer;
            position: relative;
        }

        .square.light {
            background-color: rgba(28, 28, 28, 0.92);
        }

        .square.dark {
            background-color: rgba(11, 11, 11, 0.94);
        }

        .square.selected {
            background-color: #3a0000 !important;
            box-shadow: inset 0 0 0 2px #ff2a2a;
        }

        .square.valid-move::after {
            content: "";
            width: 12px;
            height: 12px;
            background-color: rgba(255, 42, 42, 0.75);
            border-radius: 50%;
            position: absolute;
        }

        .piece-white {
            color: #ffffff;
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.25);
        }

        .piece-black {
            color: #ff2a2a;
            text-shadow: 0 0 6px rgba(255, 42, 42, 0.35);
        }

        .game-hint {
            text-align: center;
            color: #888888;
            font-size: 0.85rem;
            margin-top: 14px;
            margin-bottom: 0;
        }

        /* ضبط العرض على الهاتف */
        @media (max-width: 768px) {
            .layout {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                border-left: none;
                border-bottom: 1px solid #ff2a2a;
                padding: 18px 16px;
            }
            .main-area {
                width: 100%;
                padding: 18px 14px;
            }
        }
    </style>
</head>
<body>

    <canvas id="stars-canvas"></canvas>

    <div class="layout">
        <aside class="sidebar">
            <div class="brand-wrap">
                <span class="rook-peek" aria-hidden="true">♜</span>
                <span class="notebooks-peek" aria-hidden="true">📓📒</span>
                <div class="brand-box">
                    <span class="title">TAFKIR</span>
                    <span class="sub">♜ الدفاتر والتفكير 📓</span>
                </div>
            </div>

            <nav class="menu-box" aria-label="قائمة الموقع">
                <div class="menu-header">
                    <span>القائمة</span>
                    <span>♟️</span>
                </div>
                <ul class="menu-items">
                    <li class="active-item" onclick="showChess()">
                        <span>chees</span>
                        <span>♜</span>
                    </li>
                    <li onclick="showPlaceholder('عنصر 2')">عنصر 2 — قيد التفكير</li>
                    <li onclick="showPlaceholder('عنصر 3')">عنصر 3 — قيد التفكير</li>
                    <li onclick="showPlaceholder('عنصر 4')">عنصر 4 — قيد التفكير</li>
                </ul>
            </nav>
        </aside>

        <main class="main-area">
            <section class="canvas-box" id="chess-section">
                <div class="game-header">
                    <h1>♜ CHEES</h1>
                    <div class="status-bar">
                        <span class="turn-badge" id="turn-text">الدور: الأبيض ♔</span>
                        <button class="reset-btn" onclick="resetGame()">إعادة اللعبة</button>
                    </div>
                </div>

                <div class="board-wrapper">
                    <div class="chess-board" id="board"></div>
                </div>

                <p class="game-hint" id="game-msg">اضغط على قطعة لتحريكها (الأبيض ضد الأحمر).</p>
            </section>

            <section class="canvas-box" id="placeholder-section" style="display: none;">
                <h1 id="placeholder-title" style="color: #ff2a2a; margin-top: 0;">مساحة مفتوحة 📓</h1>
                <p style="color: #9a9a9a; line-height: 1.8;">هنا غادي تبدا تحط اللي بغيتي من بعد ما تحدد شنو غيكون في هاد الخانة.</p>
            </section>
        </main>
    </div>

    <script>
        // خلفية النجوم المتحركة فقط
        (function() {
            const canvas = document.getElementById('stars-canvas');
            const ctx = canvas.getContext('2d');
            let stars = [];
            const numStars = 140;

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            function initStars() {
                stars = [];
                for (let i = 0; i < numStars; i++) {
                    stars.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        radius: Math.random() * 1.6 + 0.3,
                        speedY: Math.random() * 0.25 + 0.05,
                        speedX: (Math.random() - 0.5) * 0.1,
                        alpha: Math.random(),
                        twinkle: Math.random() * 0.02 + 0.005
                    });
                }
            }

            function animate() {
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                for (let s of stars) {
                    s.y -= s.speedY;
                    s.x += s.speedX;
                    s.alpha += s.twinkle;

                    if (s.alpha > 1 || s.alpha < 0.2) {
                        s.twinkle = -s.twinkle;
                    }

                    if (s.y < 0) {
                        s.y = canvas.height;
                        s.x = Math.random() * canvas.width;
                    }
                    if (s.x < 0) s.x = canvas.width;
                    if (s.x > canvas.width) s.x = 0;

                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
                    ctx.fill();
                }

                requestAnimationFrame(animate);
            }

            window.addEventListener('resize', () => {
                resize();
                initStars();
            });

            resize();
            initStars();
            animate();
        })();

        // حماية المحتوى
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.ctrlKey && ['c', 'u', 's', 'p'].includes(e.key.toLowerCase())) e.preventDefault();
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'i')) e.preventDefault();
        });

        // التنقل في القائمة
        function showChess() {
            document.getElementById('chess-section').style.display = 'block';
            document.getElementById('placeholder-section').style.display = 'none';
        }

        function showPlaceholder(name) {
            document.getElementById('chess-section').style.display = 'none';
            document.getElementById('placeholder-section').style.display = 'block';
            document.getElementById('placeholder-title').textContent = name + ' 📓';
        }

        // منطق لعبة الشطرنج
        const initialSetup = [
            ['r','n','b','q','k','b','n','r'],
            ['p','p','p','p','p','p','p','p'],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['P','P','P','P','P','P','P','P'],
            ['R','N','B','Q','K','B','N','R']
        ];

        const pieceSymbols = {
            'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙',
            'k': '♚', 'q': '♛', 'r': '♜', 'b': '♝', 'n': '♞', 'p': '♟'
        };

        let board = [];
        let turn = 'white';
        let selected = null;
        let validMoves = [];
        let gameOver = false;

        function isWhite(piece) {
            return piece && piece === piece.toUpperCase();
        }

        function isBlack(piece) {
            return piece && piece === piece.toLowerCase();
        }

        function sameSide(p1, p2) {
            if (!p1 || !p2) return false;
            return (isWhite(p1) && isWhite(p2)) || (isBlack(p1) && isBlack(p2));
        }

        function getValidMoves(r, c) {
            const piece = board[r][c];
            if (!piece) return [];
            const moves = [];
            const white = isWhite(piece);
            const type = piece.toLowerCase();

            const addIfValid = (nr, nc) => {
                if (nr < 0 || nr > 7 || nc < 0 || nc > 7) return false;
                const target = board[nr][nc];
                if (!target) {
                    moves.push([nr, nc]);
                    return true;
                }
                if (!sameSide(piece, target)) {
                    moves.push([nr, nc]);
                }
                return false;
            };

            if (type === 'p') {
                const dir = white ? -1 : 1;
                const startRow = white ? 6 : 1;
                if (r + dir >= 0 && r + dir <= 7 && !board[r + dir][c]) {
                    moves.push([r + dir, c]);
                    if (r === startRow && !board[r + 2 * dir][c]) {
                        moves.push([r + 2 * dir, c]);
                    }
                }
                for (let dc of [-1, 1]) {
                    const nr = r + dir, nc = c + dc;
                    if (nr >= 0 && nr <= 7 && nc >= 0 && nc <= 7) {
                        const target = board[nr][nc];
                        if (target && !sameSide(piece, target)) {
                            moves.push([nr, nc]);
                        }
                    }
                }
            } else if (type === 'r' || type === 'q') {
                for (let [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]) {
                    let nr = r + dr, nc = c + dc;
                    while (addIfValid(nr, nc)) { nr += dr; nc += dc; }
                }
            }
            if (type === 'b' || type === 'q') {
                for (let [dr, dc] of [[1,1],[1,-1],[-1,1],[-1,-1]]) {
                    let nr = r + dr, nc = c + dc;
                    while (addIfValid(nr, nc)) { nr += dr; nc += dc; }
                }
            } else if (type === 'n') {
                for (let [dr, dc] of [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]]) {
                    addIfValid(r + dr, c + dc);
                }
            } else if (type === 'k') {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        if (dr !== 0 || dc !== 0) addIfValid(r + dr, c + dc);
                    }
                }
            }
            return moves;
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const sq = document.createElement('div');
                    sq.className = 'square ' + ((r + c) % 2 === 0 ? 'light' : 'dark');

                    if (selected && selected[0] === r && selected[1] === c) {
                        sq.classList.add('selected');
                    }

                    if (validMoves.some(m => m[0] === r && m[1] === c)) {
                        sq.classList.add('valid-move');
                    }

                    const piece = board[r][c];
                    if (piece) {
                        const span = document.createElement('span');
                        span.textContent = pieceSymbols[piece];
                        span.className = isWhite(piece) ? 'piece-white' : 'piece-black';
                        sq.appendChild(span);
                    }

                    sq.onclick = () => handleSquareClick(r, c);
                    boardEl.appendChild(sq);
                }
            }
        }

        function handleSquareClick(r, c) {
            if (gameOver) return;
            const clickedPiece = board[r][c];

            if (selected) {
                const isMove = validMoves.some(m => m[0] === r && m[1] === c);
                if (isMove) {
                    const [sr, sc] = selected;
                    const movingPiece = board[sr][sc];
                    const captured = board[r][c];

                    board[r][c] = movingPiece;
                    board[sr][sc] = '';

                    if (movingPiece === 'P' && r === 0) board[r][c] = 'Q';
                    if (movingPiece === 'p' && r === 7) board[r][c] = 'q';

                    selected = null;
                    validMoves = [];

                    if (captured && captured.toLowerCase() === 'k') {
                        gameOver = true;
                        document.getElementById('turn-text').textContent = 'انتهت اللعبة!';
                        document.getElementById('game-msg').textContent = (turn === 'white' ? 'فاز الأبيض ♔!' : 'فاز الأحمر ♚!');
                        renderBoard();
                        return;
                    }

                    turn = turn === 'white' ? 'black' : 'white';
                    document.getElementById('turn-text').textContent = turn === 'white' ? 'الدور: الأبيض ♔' : 'الدور: الأحمر ♚';
                    renderBoard();
                    return;
                }
            }

            if (clickedPiece && ((turn === 'white' && isWhite(clickedPiece)) || (turn === 'black' && isBlack(clickedPiece)))) {
                selected = [r, c];
                validMoves = getValidMoves(r, c);
            } else {
                selected = null;
                validMoves = [];
            }

            renderBoard();
        }

        function resetGame() {
            board = initialSetup.map(row => [...row]);
            turn = 'white';
            selected = null;
            validMoves = [];
            gameOver = false;
            document.getElementById('turn-text').textContent = 'الدور: الأبيض ♔';
            document.getElementById('game-msg').textContent = 'اضغط على قطعة لتحريكها (الأبيض ضد الأحمر).';
            renderBoard();
        }

        resetGame();
    </script>

</body>
</html>
